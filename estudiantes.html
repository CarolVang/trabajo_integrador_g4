<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Instituto 57</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
    <div class="logo" onclick="mostrar('inicio')">Instituto 57</div>
    <div class="acciones">
        <button class="btn-perfil-top" onclick="mostrar('perfil')">👤 Mi Perfil</button>
    </div>
</div>

<!-- FIX #1: era <section class="menu-principal">, ahora es <div> para que no
     desaparezca con el display:none que el JS aplica a todos los <section> -->
<div class="menu-principal">
    <button class="btn-menu" onclick="mostrar('novedades')">📢 Novedades</button>
    <button class="btn-menu" onclick="mostrar('eventos')">🎉 Eventos</button>
    <button class="btn-menu" onclick="mostrar('calendario')">📅 Calendario</button>
    <button class="btn-menu" onclick="mostrar('reglamentos')">📜 Reglamentos</button>
    <button class="btn-menu" onclick="mostrar('estudiantes')">👨‍🎓 Estudiantes</button>
    <button class="btn-menu" onclick="mostrar('profesores')">👩‍🏫 Profesores</button>
    <button class="btn-menu" onclick="mostrar('notas')">📝 Notas</button>
</div>

<section id="inicio" class="hero active">
    <div class="hero-texto">
        <h2>Bienvenido al Centro de Estudiantes</h2>
        <p>Conectando alumnos, profesores y administración</p>
        <button onclick="mostrar('ingreso')">Ayuda</button>
    </div>
    <div class="hero-img">
        <img src="img/img.avif" alt="Imagen de bienvenida">
    </div>
</section>

<!-- 🎉 EVENTOS -->
<section id="eventos">
    <h2>🎉 Eventos</h2>
    <div class="contenedor-filtros">
        <div class="buscador-eventos">
            <input type="text" id="buscador" placeholder="🔍 Buscar por título...">
            <!-- FIX #6: el span se rellena desde JS -->
            <span id="contadorResultados" class="contador-resultados"></span>
        </div>
        <div class="filtros-carreras">
            <button class="btn-filtro activo" onclick="filtrarCarrera('todos', this)">Todos</button>
            <button class="btn-filtro" onclick="filtrarCarrera('general', this)">🌎 Para Todos</button>
            <button class="btn-filtro" onclick="filtrarCarrera('Ciencia de Datos', this)">📊 Ciencia de Datos</button>
            <button class="btn-filtro" onclick="filtrarCarrera('Farmacia', this)">💊 Farmacia</button>
            <button class="btn-filtro" onclick="filtrarCarrera('Trabajo Social', this)">🤝 Trabajo Social</button>
        </div>
    </div>

    <button id="btnCrearEvento" style="display:none; margin-top:15px;" onclick="mostrar('crearEvento')">
        ➕ Crear evento
    </button>

    <div id="listaEventos">
        <div class="evento" data-titulo="Fiesta del Instituto" data-fecha="Viernes 25 - 20:00 hs" data-tipo="opcional" data-carrera="general">
            <h3>Fiesta del Instituto</h3>
            <p class="tag-carrera">🌎 Para: Todas las carreras</p>
            <p>Viernes 25 - 20:00 hs</p>
            <p>🟢 Opcional</p>
            <!-- FIX #6: contador de inscriptos, se rellena desde JS -->
            <span id="contadorEvento1" class="contador-evento"></span>
            <div class="evento-botones">
                <!-- FIX #2: anotarseEvento ahora existe en script.js -->
                <button id="btnEvento1" onclick="anotarseEvento('evento1', 'opcional')">Anotarse</button>
            </div>
        </div>
    </div>
</section>

<!-- 👤 PERFIL -->
<section id="perfil">
    <div class="perfil-wrapper">
        <div class="perfil-card">
            <div class="perfil-header"><h1>Mi Perfil</h1></div>
            <div class="perfil-foto">
                <img id="fotoPerfil" src="https://placehold.co/120x120?text=Foto" class="avatar">
                <input type="file" id="cambiarFoto" accept="image/*" style="display:none;">
                <div style="margin-top:10px; display:flex; gap:8px; justify-content:center;">
                    <button onclick="document.getElementById('cambiarFoto').click()">📷 Cambiar</button>
                </div>
            </div>
            <div class="perfil-info">
                <div class="dato"><span>Nombre</span><p id="nombre">Usuario Demo</p></div>
                <div class="dato"><span>Rango</span><p id="rango">Estudiante</p></div>
            </div>

            <!-- FIX #3: cambiarContrasena() ahora existe en script.js -->
            <button class="btn-secundario" onclick="cambiarContrasena()">Cambiar contraseña</button>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            <button onclick="cerrarSesion()" style="background: #ef4444; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">
                🚪 Cerrar Sesión
            </button>
        </div>
    </div>
</section>

<!-- LOGIN -->
<!-- FIX #4: ahora el login valida la contraseña (lógica en script.js) -->
<div id="login-container">
    <div class="login-box">
        <h2>Iniciar Sesión</h2>
        <select id="tipo">
            <option value="estudiante">Estudiante</option>
            <option value="profesor">Profesor</option>
            <option value="administrativo">Administrativo</option>
        </select>
        <input type="text" id="nombreLogin" placeholder="Nombre">
        <input type="password" id="passwordLogin" placeholder="Contraseña">
        <button onclick="login()">Ingresar</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
